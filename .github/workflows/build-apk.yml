name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          java -version
          VERSION_LINE="$(java -version 2>&1 | head -n 1 || true)"
          RAW_VERSION="$(echo "$VERSION_LINE" | sed -n 's/.*"\([0-9][0-9._+-]*\)".*/\1/p')"
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Unable to detect active Java version from: $VERSION_LINE"
            exit 1
          fi
          if [[ "$RAW_VERSION" == 1.* ]]; then
            MAJOR_VERSION="$(echo "$RAW_VERSION" | cut -d'.' -f2)"
          else
            MAJOR_VERSION="$(echo "$RAW_VERSION" | cut -d'.' -f1)"
          fi
          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Parsed invalid Java major version '$MAJOR_VERSION' from '$RAW_VERSION'."
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VERSION."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          if [ ! -x "$KEYTOOL_BIN" ]; then
            echo "::error::keytool was not found in configured Java 17 installation at ${KEYTOOL_BIN}."
            exit 1
          fi
          if [ -f "./debug.keystore" ]; then
            echo "Temporary ./debug.keystore already exists; skipping generation."
          else
            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
            echo "Generated temporary ./debug.keystore using Java 17 keytool."
          fi
          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore."
            exit 1
          fi

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK root: ${SDK_ROOT}"
          SDKMANAGER_BIN=""
          if [ -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          elif [ -d "${SDK_ROOT}/cmdline-tools" ]; then
            SDKMANAGER_BIN="$(find "${SDK_ROOT}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -n "$SDKMANAGER_BIN" ] && [ -x "$SDKMANAGER_BIN" ]; then
            echo "Using sdkmanager: ${SDKMANAGER_BIN}"
            set +o pipefail
            yes | "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            set -o pipefail
            "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" \
              "platform-tools" \
              "build-tools;36.0.0" \
              "platforms;android-36" \
              "platforms;android-36.1" || true
          else
            echo "::warning::sdkmanager not found under ${SDK_ROOT}; relying on preinstalled SDK packages."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK paths inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} exists but is not a regular file."
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi
          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::${EXPECTED_APK} does not have the .apk extension."
            exit 1
          fi
          echo "Verified debug APK: ${EXPECTED_APK}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          RAW_REPO="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO="$(echo "$RAW_REPO" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g; s/-\{2,\}/-/g; s/^-//; s/-$//')"
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="android-app"
          fi
          TEMP_ASSET_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")"
          ASSET_FILENAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${TEMP_ASSET_DIR}/${ASSET_FILENAME}"
          cp "$SOURCE_APK" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset is invalid: ${ASSET_PATH}"
            exit 1
          fi
          echo "Prepared release asset: ${ASSET_FILENAME}"
          {
            echo "asset_path=${ASSET_PATH}"
            echo "asset_filename=${ASSET_FILENAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        run: |
          set -euo pipefail
          gh --version
          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared APK release asset is missing or invalid."
            exit 1
          fi
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="$(printf '%s\n' \
            "Automatically generated debug APK built by GitHub Actions." \
            "" \
            "- GitHub Actions Run Number: ${GITHUB_RUN_NUMBER}" \
            "- GitHub Actions Run Attempt: ${GITHUB_RUN_ATTEMPT}" \
            "- Source Commit SHA: ${GITHUB_SHA}" \
            "" \
            "Notice:" \
            "- This APK is intended for testing only." \
            "- This APK is not a Play Store production release." \
            "- This APK is signed only with a temporary debug keystore.")"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: ${{ always() && steps.publish_release.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            gh release view "$RELEASE_TAG" >/dev/null
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_FILENAME}"
            {
              echo "### Debug APK Build & Release Summary"
              echo ""
              echo "- **Status:** APK build, artifact upload, and GitHub Release publishing succeeded."
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **APK Asset Filename:** \`${ASSET_FILENAME}\`"
              echo "- **GitHub Release Page:** ${RELEASE_URL}"
              echo ""
              echo "Download the APK directly from the **Assets** section on the GitHub Release page above. The GitHub Actions artifact \`app-debug-apk\` is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            {
              echo "### Debug APK Build Summary (Release Publishing Warning)"
              echo ""
              echo "> **Warning:** GitHub Release publishing failed for tag \`${RELEASE_TAG}\`, so no GitHub Release URL is available."
              echo ""
              echo "- **APK Build Status:** Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
              echo "- **Actions Artifact Backup:** \`app-debug-apk\` remains available for download from this workflow run's **Artifacts** section."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
